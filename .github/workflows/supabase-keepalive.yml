# Free Supabase projects pause after 7 days of inactivity. A daily lightweight request keeps it awake.
name: Supabase keep-alive
on:
  schedule: [{ cron: "17 6 * * *" }]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          # Hits a real table (RLS returns [] for anon) so the database registers activity.
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" -o /dev/null
